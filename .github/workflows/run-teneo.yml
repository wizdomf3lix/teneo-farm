name: Run Teneo Node CLI (manual token)

on:
  workflow_dispatch:

jobs:
  run-node-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies if package.json exists
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Mask token in logs
        run: |
          echo "::add-mask::${{ secrets.ACCESS_TOKEN }}"

      - name: Run main.js with automated stdin answers
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          # Provide answers to the interactive prompts:
          # 1) "Do you want to use a proxy? (y/n): " -> n
          # 2) "User Token not found... Choose an option: " -> 3
          # 3) "Please enter your access token: " -> $ACCESS_TOKEN
          printf "n\n3\n%s\n" "$ACCESS_TOKEN" | node main.js
