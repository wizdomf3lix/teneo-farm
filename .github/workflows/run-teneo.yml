name: Run Teneo Farm 24/7

on:
  workflow_dispatch:

jobs:
  run-teneo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          npm install

      - name: Run script with token
        env:
          TENEO_TOKEN: ${{ secrets.TENEO_TOKEN }}
        run: |
          printf "n\n3\n%s\n" "$TENEO_TOKEN" | node main.js
